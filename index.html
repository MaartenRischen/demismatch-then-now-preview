<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Then and Now</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Sans+Narrow:wght@400;700&family=Charis+SIL&display=block">
<style>
  /* Type from the Decode deep-read system: PT Sans Narrow for what you read first, Charis SIL for sources.
     Colour only where it means something: red is you, gold is the signal. One strip, centred on wide screens. */
  :root {
    --light: #F1EEE8; --dim: rgba(241,238,232,.62); --you: #E0201A; --sig: #E2A93A;
    --narrow: "PT Sans Narrow", "Arial Narrow", sans-serif; --read: "Charis SIL", Charter, Georgia, serif;
    --bg: #1D1A17;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1D1A17; } }
  :root[data-theme="dark"] { --bg: #1D1A17; }
  html, body { margin: 0; background: var(--bg); -webkit-font-smoothing: antialiased; }
  #page { position: relative; overflow: hidden; }
  canvas { position: absolute; left: 0; top: 0; display: block; }
  #words { transition: opacity .35s; pointer-events: none; }
  #words.out { opacity: 0; }
  #words p, .foot { position: absolute; margin: 0; }
  #then, #now { font-family: var(--narrow); font-weight: 700; line-height: 1.06; color: var(--light); text-wrap: balance; }
  #now span { display: block; }
  #fact { font-weight: 400; font-size: 0.66em; line-height: 1.15; margin-top: 0.3em; color: var(--dim); }
  .foot { font-family: var(--read); font-size: 11px; line-height: 1.35; color: var(--dim); }
  .foot .ring { display: inline-block; width: 0.75em; height: 0.75em; border: 1.5px solid var(--sig); border-radius: 50%; vertical-align: -0.08em; margin: 0 0.45em 0 0.9em; }
  .foot .off { display: none; }
  #key { white-space: nowrap; }
  nav { position: fixed; bottom: 0; height: 44px; display: flex; align-items: center; gap: 2px; padding: 0 12px; box-sizing: border-box; overflow-x: auto; scrollbar-width: none; background: var(--bg); box-shadow: 0 -1px 0 rgba(241,238,232,.1); }
  nav::-webkit-scrollbar { display: none; }
  nav button { flex: none; border: 0; background: none; cursor: pointer; font-family: var(--narrow); font-size: 16px; color: var(--dim); padding: 8px 8px; position: relative; }
  nav button:hover { color: var(--light); }
  nav button.on { color: var(--light); font-weight: 700; }
  nav button.on::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: 4px; height: 2px; background: var(--light); transform-origin: left; transform: scaleX(var(--p, 0)); }
</style>
</head>
<body>
<div id="page">
<canvas id="cv"></canvas>
<div id="words"><p id="then"></p><p id="now"><span id="main"></span><span id="fact"></span></p>
<p class="foot" id="foot"><span id="src"></span><span id="key"><span class="ring"></span>Gold rings: the alarm is on</span></p></div>
</div>
<nav id="nav"></nav>
<script type="module" src="./line/src/strip.js"></script>
</body>
</html>
