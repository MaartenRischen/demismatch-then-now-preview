<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Then and Now</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Sans+Narrow:wght@400;700&family=Charis+SIL&display=block">
<style>
  /* Type from the Decode deep-read system: PT Sans Narrow for what you read first, Charis SIL for sources.
     Colour only where it means something: red is you, gold is the signal. One strip, centred on wide screens. */
  :root {
    --light: #F1EEE8; --dim: rgba(241,238,232,.62); --you: #E0201A; --sig: #E2A93A;
    --narrow: "PT Sans Narrow", "Arial Narrow", sans-serif; --read: "Charis SIL", Charter, Georgia, serif;
    --bg: #1D1A17;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1D1A17; } }
  :root[data-theme="dark"] { --bg: #1D1A17; }
  html, body { margin: 0; background: var(--bg); -webkit-font-smoothing: antialiased; }
  #page { position: relative; overflow: hidden; }
  canvas { position: absolute; left: 0; top: 0; display: block; }
  #words { transition: opacity .35s; pointer-events: none; }
  #words.out { opacity: 0; }
  #words p, .foot { position: absolute; margin: 0; }
  #then, #now { font-family: var(--narrow); font-weight: 700; line-height: 1.06; color: var(--light); text-wrap: balance; text-align: center; }
  #now span { display: block; }
  .foot { font-family: var(--read); font-size: 11px; line-height: 1.4; color: rgba(241,238,232,.5); text-align: center; text-wrap: balance; }
  #src, #key { display: block; }
  .foot .ring { display: inline-block; width: 0.75em; height: 0.75em; border: 1.5px solid var(--sig); border-radius: 50%; vertical-align: -0.08em; margin-right: 0.45em; }
  #key { margin-top: 0.25em; }
  #key.off { display: none; }
    nav { position: fixed; left: 0; right: 0; bottom: 0; height: 46px; display: flex; align-items: center; gap: 2px; padding: 0 24px; box-sizing: border-box; overflow-x: auto; scrollbar-width: none; background: var(--bg);
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 24px, #000 calc(100% - 24px), transparent); mask-image: linear-gradient(90deg, transparent, #000 24px, #000 calc(100% - 24px), transparent); }
  /* centred when the topics fit, scrollable when they don't */
  nav button:first-child { margin-left: auto; } nav button:last-child { margin-right: auto; }
  nav::-webkit-scrollbar { display: none; }
  nav button { flex: none; border: 0; background: none; cursor: pointer; font-family: var(--narrow); font-size: 16px; color: rgba(241,238,232,.5); padding: 8px 9px; position: relative; }
  nav button:hover { color: var(--light); }
  nav button.on { color: var(--light); font-weight: 700; }
  nav button.on::after { content: ""; position: absolute; left: 9px; right: 9px; bottom: 5px; height: 2px; background: var(--light); transform-origin: left; transform: scaleX(var(--p, 0)); }
</style>
</head>
<body>
<div id="page">
<canvas id="cv"></canvas>
<div id="words"><p id="then"></p><p id="now"><span id="main"></span></p>
<p class="foot" id="foot"><span id="src"></span><span id="key"><span class="ring"></span>Gold rings: the alarm is on</span></p></div>
</div>
<nav id="nav"></nav>
<script type="module" src="./line/src/strip.v4.js"></script>
</body>
</html>
